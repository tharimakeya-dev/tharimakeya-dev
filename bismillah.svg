<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="reveal">
      <rect y="0" height="140" x="760" width="0">
        <animate attributeName="x" dur="7s" repeatCount="indefinite"
                 keyTimes="0;0.5;0.88;1" values="760;40;40;760" calcMode="linear"/>
        <animate attributeName="width" dur="7s" repeatCount="indefinite"
                 keyTimes="0;0.5;0.88;1" values="0;720;720;0" calcMode="linear"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#reveal)">
    <text x="400" y="85" text-anchor="middle" direction="rtl"
          font-family="'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New','Arial',serif"
          font-size="56" font-weight="bold" fill="#e60000" filter="url(#glow)">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </text>
  </g>
</svg>
