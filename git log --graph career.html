<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>git log --graph career</title>
<style>
:root{--bg:#fff;--fg:#222;--muted:#666;--chip:#f1f1f1;--bd:#d8d8d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--muted:#aaa;--chip:#25262c;--bd:#3a3b42}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--muted:#aaa;--chip:#25262c;--bd:#3a3b42}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:20px}
h1{font-size:20px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
code{background:var(--chip);padding:2px 8px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-weight:700}
.stage{position:relative;background:var(--bg);overflow:hidden;max-width:900px}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;max-width:none}
svg{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
text{font-family:ui-monospace,Consolas,monospace}
.pill{font-size:12px;fill:#fff;font-weight:600}
.cl{font-size:8.5px;fill:var(--fg)}
.yr{font-size:8px;fill:#fff;font-weight:700}
.dot{cursor:pointer}
.b{width:30px;height:30px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.b:hover{background:var(--chip)}
.b svg{width:16px;height:16px;cursor:pointer;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;top:14%;right:3%;display:flex;gap:6px}
.pad{position:absolute;right:3%;bottom:4%;display:grid;grid-template-columns:repeat(3,30px);gap:6px}
#info{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
</style>
</head>
<body>
<h1>🧭 <code>git log --graph career</code></h1>
<div class="stage" id="stage">
<svg id="g" viewBox="0 0 880 330"></svg>
<div class="top">
  <button class="b" id="full" title="Expand"><svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
  <button class="b" id="copy" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
</div>
<div class="pad">
  <span></span>
  <button class="b" data-a="up" title="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button class="b" data-a="in" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/></svg></button>
  <button class="b" data-a="left" title="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="b" data-a="reset" title="Reset"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button>
  <button class="b" data-a="right" title="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <span></span>
  <button class="b" data-a="down" title="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="b" data-a="out" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/></svg></button>
</div>
</div>
<div id="info">Kono commit e click/hover koro</div>

<script>
/* ====== TOMAR DATA ETA BODLAO ====== */
const lanes=[
 {id:'career',y:50,c:'#f0592a'},
 {id:'learning',y:116,c:'#c8401a'},
 {id:'internships',y:183,c:'#ff6b3d'},
 {id:'projects',y:249,c:'#8f8a82'}];
const X0=132,X1=840;
// lane branch: kothay theke kothay porjonto (main e merge hoy)
const branches=[
 {lane:'projects',from:427,to:758},
 {lane:'internships',from:132,to:611},
 {lane:'learning',from:132,to:427}];
const drops=[{x:353,lane:'internships'}]; // main theke lane e shoja line
const commits=[
 {l:'career',x:132,t:'git init github',d:'Journey shuru',f:1},
 {l:'career',x:353,d:'2024 milestone'},{l:'career',x:427,d:'Merge point'},
 {l:'career',x:611,d:'2025 milestone'},{l:'career',x:758,t:'AI Engineer @ PadelOS',d:'Current role'},
 {l:'career',x:790,t:'PadelOS MCP Server',d:'Project',f:1},
 {l:'learning',x:169,t:'#100DaysOfByteWise',d:'Learning streak'},
 {l:'learning',x:206,t:'Phishing URL Detection',d:'ML project'},
 {l:'learning',x:390,t:'Smog Classification',d:'CV project'},
 {l:'internships',x:243,t:'CodeAlpha',d:'Internship'},
 {l:'internships',x:280,t:'CodSoft',d:'Internship'},
 {l:'internships',x:317,t:'Itsolera',d:'Internship'},
 {l:'internships',x:537,t:'Buildables Fellowship',d:'Fellowship'},
 {l:'internships',x:574,t:'IR Solutions - AI',d:'Internship'},
 {l:'projects',x:463,t:'PPE Detection · YOLOv8 + ROS',d:'Project'},
 {l:'projects',x:500,t:'Brain Tumor U-Net',d:'Project'},
 {l:'projects',x:648,t:'Agentic Renovation Planner',d:'Project'},
 {l:'projects',x:685,t:'Roid2-AI',d:'Project'},
 {l:'projects',x:721,t:'MCP Server Course',d:'Project'}];
const years=[{x:132,t:'2026'}];
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* =================================== */
const svg=document.getElementById('g'),NS='http://www.w3.org/2000/svg',info=document.getElementById('info');
const L=id=>lanes.find(l=>l.id===id),M=lanes[0],R=16;
const el=(n,a,p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};

lanes.forEach(l=>{
 el('line',{x1:125,x2:870,y1:l.y,y2:l.y,stroke:'#888','stroke-dasharray':'1.5 3','stroke-width':.6});
 el('rect',{x:10,y:l.y-11,width:92,height:22,rx:3,fill:l.c});
 el('text',{x:56,y:l.y+4,'text-anchor':'middle',class:'pill'}).textContent=l.id;
});
const sw={'stroke-width':7,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
branches.forEach(b=>{const l=L(b.lane);
 el('path',{...sw,stroke:l.c,d:`M${b.from} ${M.y}V${l.y-R}Q${b.from} ${l.y} ${b.from+R} ${l.y}H${b.to-R}Q${b.to} ${l.y} ${b.to} ${l.y-R}V${M.y}`});});
drops.forEach(d=>el('line',{...sw,stroke:L(d.lane).c,x1:d.x,x2:d.x,y1:M.y,y2:L(d.lane).y}));
el('line',{...sw,stroke:M.c,x1:X0,x2:X1,y1:M.y,y2:M.y});

years.forEach(y=>{
 el('path',{d:`M${y.x-16} ${M.y-36}l5 -5h25v10h-25z`,fill:'#111'});
 el('text',{x:y.x+1,y:M.y-33,'text-anchor':'middle',class:'yr'}).textContent=y.t;
});
months.forEach((m,i)=>{const x=X0+i*(X1-X0)/11;
 el('line',{x1:x,x2:x,y1:M.y-24,y2:M.y-19,stroke:'#888','stroke-width':1});
 el('text',{x:x,y:M.y-12,'text-anchor':'middle',style:'font-size:8px;fill:#888'}).textContent=m;
});
commits.forEach(c=>{
 const l=L(c.l),hollow=c.l==='career'&&!c.t,first=c.f&&c.x===132;
 const dot=el('circle',{cx:c.x,cy:l.y,r:hollow?7.5:7,class:'dot',
  fill:hollow?'#fff':l.c,stroke:hollow?l.c:'none','stroke-width':4});
 if(c.t&&c.x===790)dot.remove();
 const show=()=>info.textContent=(c.t||'Milestone')+' — '+c.d;
 dot.addEventListener('mouseenter',show);dot.addEventListener('click',show);
 if(c.t){const ty=l.y+14,tx=c.x+3;
  el('text',{x:tx,y:ty,class:'cl','text-anchor':'end',transform:`rotate(-50 ${tx} ${ty})`}).textContent=c.t;}
});
// current role end-dot
el('circle',{cx:758,cy:M.y,r:7.5,fill:'#fff',stroke:M.c,'stroke-width':4});

// ---- pan / zoom ----
const B={x:0,y:0,w:880,h:330};let v={...B};
const set=()=>svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);
const zoom=f=>{const cx=v.x+v.w/2,cy=v.y+v.h/2;v.w*=f;v.h*=f;v.x=cx-v.w/2;v.y=cy-v.h/2;set()};
const pan=(dx,dy)=>{v.x+=dx*v.w;v.y+=dy*v.h;set()};
const act={in:()=>zoom(.8),out:()=>zoom(1.25),up:()=>pan(0,-.15),down:()=>pan(0,.15),
 left:()=>pan(-.15,0),right:()=>pan(.15,0),reset:()=>{v={...B};set()}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act[b.dataset.a]());
// drag to pan
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing'});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
 v.x-=(e.clientX-drag.x)*v.w/r.width;v.y-=(e.clientY-drag.y)*v.h/r.height;drag={x:e.clientX,y:e.clientY};set()});
svg.addEventListener('pointerup',()=>{drag=null;svg.style.cursor='grab'});
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.9:1.1)},{passive:false});

// expand (fullscreen)
document.getElementById('full').onclick=()=>{
 try{const s=document.getElementById('stage');
  document.fullscreenElement?document.exitFullscreen():s.requestFullscreen();}catch(e){}};
// copy (text version of the graph)
document.getElementById('copy').onclick=async()=>{
 const txt=lanes.map(l=>l.id+':\n'+commits.filter(c=>c.l===l.id&&c.t).map(c=>'  * '+c.t).join('\n')).join('\n');
 try{await navigator.clipboard.writeText('git log --graph career\n'+txt);info.textContent='Copied ✓'}
 catch(e){info.textContent='Copy kora gelo na'}};
</script>
</body>
</html>
