<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নদীর ঢেউ ও মাছ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#eaf6ff}
  .river{
    position:relative;width:100%;height:100%;
    background:linear-gradient(180deg,#f4fbff 0%,#bfe9ff 35%,#9ec5ff 70%,#b8a6ff 100%);
    overflow:hidden;
  }

  /* ---------- ঢেউ ---------- */
  .wave{position:absolute;left:0;width:200%;height:60%;bottom:0;}
  .wave svg{width:100%;height:100%;display:block}
  .w1{bottom:38%;opacity:.55;animation:slide 14s linear infinite, bob 5s ease-in-out infinite}
  .w2{bottom:30%;opacity:.6; animation:slide 20s linear infinite reverse, bob 6s ease-in-out infinite .8s}
  .w3{bottom:22%;opacity:.65;animation:slide 11s linear infinite, bob 4.5s ease-in-out infinite 1.4s}
  .w4{bottom:12%;opacity:.7; animation:slide 17s linear infinite reverse, bob 5.5s ease-in-out infinite .3s}
  .w5{bottom:0;  opacity:.85;animation:slide 9s linear infinite, bob 4s ease-in-out infinite 1s}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:18px}}

  /* ---------- মাছ ---------- */
  .fish{position:absolute;left:0;top:0;z-index:5;will-change:transform;opacity:0}
  .fish .flip{width:100%;height:100%}
  .fish svg{width:100%;height:100%;overflow:visible;display:block}
  .fish .tail{transform-origin:70% 50%;animation:tail .35s ease-in-out infinite alternate}
  @keyframes tail{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

  /* ---------- বুদবুদ (মাছের সাথে) ---------- */
  .bubble{position:absolute;left:0;top:0;border-radius:50%;z-index:4;pointer-events:none;
          animation:pop 1.8s ease-out forwards}
  @keyframes pop{
    0%{transform:translate(0,0) scale(.5);opacity:0}
    15%{opacity:.95}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}
  }

  /* ---------- পানির ছিটা ---------- */
  .drop{position:absolute;left:0;top:0;border-radius:50%;z-index:6;pointer-events:none;
        animation:splash .9s ease-out forwards}
  @keyframes splash{
    0%{transform:translate(0,0);opacity:.95}
    45%{transform:translate(calc(var(--dx)*.5),var(--up));opacity:.95}
    100%{transform:translate(var(--dx),0);opacity:0}
  }

  @media (prefers-reduced-motion:reduce){
    .wave{animation:none !important}
  }
</style>
</head>
<body>
<div class="river" id="river">

  <!-- ঢেউ: বেগুনি, নীল, আকাশি, হালকা সবুজ -->
  <div class="wave w1"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#86efac" d="M0 100 Q150 40 300 100 T600 100 T900 100 T1200 100 V200 H0Z"/></svg></div>
  <div class="wave w2"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#7dd3fc" d="M0 100 Q150 150 300 100 T600 100 T900 100 T1200 100 V200 H0Z"/></svg></div>
  <div class="wave w3"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#60a5fa" d="M0 100 Q150 40 300 100 T600 100 T900 100 T1200 100 V200 H0Z"/></svg></div>
  <div class="wave w4"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#818cf8" d="M0 100 Q150 150 300 100 T600 100 T900 100 T1200 100 V200 H0Z"/></svg></div>
  <div class="wave w5"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="#a78bfa" d="M0 100 Q150 45 300 100 T600 100 T900 100 T1200 100 V200 H0Z"/></svg></div>

</div>

<script>
  const river = document.getElementById('river');
  const colors = ['#fbbf24','#3b82f6','#06d6c8','#f472b6','#a78bfa','#fb923c','#34d399','#f87171'];
  const bubblePalette = ['#f87171','#fbbf24','#34d399','#06d6c8','#60a5fa','#a78bfa','#f472b6','#fb923c'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a,b)=>a+Math.random()*(b-a);

  // মাছের ছবি (মাথা বাঁ দিকে)
  function fishSVG(c){
    return `<svg viewBox="0 0 90 50">
      <g class="tail"><path d="M62 25 L88 6 L88 44 Z" fill="${c}"/></g>
      <ellipse cx="38" cy="26" rx="30" ry="18" fill="${c}"/>
      <path d="M30 10 Q38 -2 48 10 Z" fill="${c}"/>
      <ellipse cx="38" cy="32" rx="22" ry="8" fill="#000" opacity=".08"/>
      <circle cx="18" cy="21" r="4.5" fill="#fff"/><circle cx="17" cy="21" r="2.2" fill="#222"/>
      <path d="M44 14 Q50 26 44 38" stroke="#fff" stroke-width="2" fill="none" opacity=".45"/>
    </svg>`;
  }

  /* ---------- সাঁতারু মাছ (দুই পাশ থেকে আসে, উপরে-নিচে ওঠানামা করে) ---------- */
  const fishes = [];
  const COUNT = 8;                          // মাছের সংখ্যা

  for(let i=0;i<COUNT;i++){
    const el = document.createElement('div');
    el.className = 'fish';
    const w = rand(26,46);                  // মাছের সাইজ (ছোট)
    el.style.width = w+'px';
    el.style.height = w*0.55+'px';
    const flip = document.createElement('div');
    flip.className = 'flip';
    flip.innerHTML = fishSVG(colors[i % colors.length]);
    el.appendChild(flip);
    river.appendChild(el);
    const f = {el, flip, w, h:w*0.55, bubbleT:0};
    respawn(f, i*1100);                     // একেক করে শুরু
    fishes.push(f);
  }

  function respawn(f, delay=0){
    const W = innerWidth;
    f.dir   = Math.random() < 0.5 ? 1 : -1; // 1 = বাঁ→ডান, -1 = ডান→বাঁ
    f.x     = f.dir === 1 ? -f.w - 20 : W + 20;
    f.speed = rand(45,80);                  // px/sec
    f.period= rand(7,11);                   // একবার উঠে-নামার সময় (সেকেন্ড)
    f.phase = rand(0,6.28);
    f.start = performance.now() + delay;
    f.flip.style.transform = f.dir === 1 ? 'scaleX(-1)' : 'none';
  }

  /* ---------- বুদবুদ ---------- */
  function makeBubble(x, y, color){
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = rand(4,9);
    b.style.width = b.style.height = s+'px';
    b.style.left = x+'px'; b.style.top = y+'px';
    b.style.background = color;
    b.style.boxShadow = `0 0 6px ${color}99, inset -1px -1px 3px #ffffffaa`;
    b.style.setProperty('--dx', rand(-14,14)+'px');
    b.style.setProperty('--dy', -rand(40,90)+'px');
    b.style.animationDuration = rand(1.3,2.2)+'s';
    b.addEventListener('animationend', ()=>b.remove());
    river.appendChild(b);
  }

  /* ---------- পানির ছিটা ---------- */
  function splash(x, y){
    if(reduce) return;
    for(let i=0;i<9;i++){
      const d = document.createElement('div');
      d.className = 'drop';
      const sz = rand(3,7);
      d.style.width = d.style.height = sz+'px';
      d.style.left = x+'px'; d.style.top = y+'px';
      d.style.background = bubblePalette[Math.floor(Math.random()*bubblePalette.length)];
      d.style.setProperty('--dx', rand(-45,45)+'px');
      d.style.setProperty('--up', -rand(25,70)+'px');
      d.addEventListener('animationend', ()=>d.remove());
      river.appendChild(d);
    }
  }

  /* ---------- লাফানো মাছ: নিচ থেকে উঠে → লাফ → ছিটা দিয়ে ডুব → নিচে ---------- */
  const jumpers = [];
  const JUMPERS = 3;                        // লাফানো মাছের সংখ্যা
  for(let i=0;i<JUMPERS;i++){
    const el = document.createElement('div');
    el.className = 'fish';
    const w = rand(30,44);
    el.style.width = w+'px'; el.style.height = w*0.55+'px';
    const flip = document.createElement('div');
    flip.className = 'flip';
    flip.innerHTML = fishSVG(colors[(i*3+1) % colors.length]);
    el.appendChild(flip);
    river.appendChild(el);
    jumpers.push({el, flip, w, h:w*0.55, state:'wait', next: performance.now() + 1500 + i*2200, bubbleT:0});
  }

  function launch(j, now){
    const H = innerHeight, W = innerWidth;
    j.x0 = rand(W*0.1, W*0.9);
    j.y0 = H*0.88;                          // নিচ থেকে শুরু
    j.top = H*rand(0.08,0.16);              // লাফের সর্বোচ্চ উচ্চতা
    j.g = H*1.3;
    j.vy = Math.sqrt(2*j.g*(j.y0 - j.top));
    j.vx = (Math.random()<.5?-1:1) * rand(40,110);
    j.t0 = now; j.state = 'jump'; j.prevY = j.y0;
    j.flip.style.transform = j.vx > 0 ? 'scaleX(-1)' : 'none';
  }

  const SURFACE = () => innerHeight * 0.33; // পানির উপরিতল

  function updateJumpers(now, dt){
    for(const j of jumpers){
      if(j.state === 'wait'){
        j.el.style.opacity = 0;
        if(now >= j.next) launch(j, now);
        continue;
      }
      const t = (now - j.t0)/1000;
      const y = j.y0 - j.vy*t + 0.5*j.g*t*t;
      const x = j.x0 + j.vx*t;
      const vyDown = -j.vy + j.g*t;
      const theta = j.vx > 0 ? Math.atan2(vyDown, j.vx) : Math.atan2(-vyDown, -j.vx);
      j.el.style.opacity = y > SURFACE() ? .8 : 1;
      j.el.style.transform = `translate(${x}px, ${y}px) rotate(${theta*180/Math.PI}deg)`;

      // পানিতে ঢোকা/বের হওয়ার সময় ছিটা
      const S = SURFACE();
      if((j.prevY > S && y <= S) || (j.prevY < S && y >= S)) splash(x + j.w/2, S);
      j.prevY = y;

      // পানির নিচে থাকলে বুদবুদ
      j.bubbleT -= dt;
      if(y > S && j.bubbleT <= 0 && !reduce){
        j.bubbleT = rand(.08,.2);
        makeBubble(x + j.w/2, y, bubblePalette[Math.floor(Math.random()*bubblePalette.length)]);
      }

      if(y >= j.y0 && t > .2){              // নিচে ফিরে গেছে
        j.state = 'wait';
        j.next = now + rand(2500,6000);
      }
    }
  }

  /* ---------- মূল অ্যানিমেশন লুপ ---------- */
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now-last)/1000, .05); last = now;
    const W = innerWidth, H = innerHeight;
    for(const f of fishes){
      if(now < f.start){ f.el.style.opacity = 0; continue; }
      f.x += f.dir * f.speed * dt;

      const t = (now - f.start)/1000;
      const wave = (Math.sin(t/f.period*6.283 + f.phase) + 1) / 2;   // 0 = নিচে, 1 = উপরে
      const deep = H*0.88, surface = H*0.30;
      const y = deep - (deep - surface) * wave;
      const slope = Math.cos(t/f.period*6.283 + f.phase);
      const tilt = -slope * 22 * f.dir;

      f.el.style.opacity = .95;
      f.el.style.transform = `translate(${f.x}px, ${y}px) rotate(${tilt}deg)`;

      // মাছের মুখের কাছ থেকে বুদবুদ
      f.bubbleT -= dt;
      if(f.bubbleT <= 0 && !reduce){
        f.bubbleT = rand(.15,.4);
        const bx = f.dir === 1 ? f.x + f.w : f.x;
        makeBubble(bx, y + f.h*0.3, bubblePalette[Math.floor(Math.random()*bubblePalette.length)]);
      }

      // পার হয়ে গেলে অন্য পাশ থেকে আবার আসবে
      if((f.dir === 1 && f.x > W + 40) || (f.dir === -1 && f.x < -f.w - 40)) respawn(f, rand(0,1500));
    }
    updateJumpers(now, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
