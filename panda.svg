<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="240" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bob { animation: bob 2.4s ease-in-out infinite; }
    .wave { animation: wave 1.2s ease-in-out infinite; transform-origin: 158px 158px; }
    .blink { animation: blink 4s infinite; transform-origin: 120px 98px; }
    .earL { animation: wiggleL 3s ease-in-out infinite; transform-origin: 82px 66px; }
    .earR { animation: wiggleR 3s ease-in-out infinite; transform-origin: 158px 66px; }
    .twinkle { animation: twinkle 2s ease-in-out infinite; }
    .t2 { animation-delay: .7s; }
    .t3 { animation-delay: 1.3s; }
    .leaf { animation: leaf 2s ease-in-out infinite; transform-origin: 62px 122px; }
    @keyframes leaf { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 120px 238px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes wave { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(28deg); } }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    @keyframes wiggleL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
    @keyframes wiggleR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(8deg); } }
    @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .25; } 50% { transform: scaleX(.88); opacity: .15; } }
  </style>

  <!-- sparkles -->
  <g fill="#2E8B57">
    <path class="twinkle" style="transform-origin:30px 60px" d="M30 50 L33 57 L40 60 L33 63 L30 70 L27 63 L20 60 L27 57 Z"/>
    <path class="twinkle t2" style="transform-origin:212px 90px" d="M212 80 L214.5 86 L221 90 L214.5 94 L212 100 L209.5 94 L203 90 L209.5 86 Z"/>
    <path class="twinkle t3" style="transform-origin:200px 30px" d="M200 24 L202 28 L206 30 L202 32 L200 36 L198 32 L194 30 L198 28 Z"/>
  </g>

  <ellipse class="shadow" cx="120" cy="238" rx="62" ry="7" fill="#000"/>

  <g class="bob">
    <!-- legs -->
    <ellipse cx="84" cy="214" rx="24" ry="18" fill="#2E8B57"/>
    <ellipse cx="156" cy="214" rx="24" ry="18" fill="#2E8B57"/>

    <!-- body -->
    <ellipse cx="120" cy="172" rx="56" ry="52" fill="#fff" stroke="#2E8B57" stroke-width="3"/>
    <ellipse cx="120" cy="182" rx="32" ry="30" fill="#EAF7F0"/>

    <!-- left arm -->
    <ellipse cx="68" cy="168" rx="14" ry="26" fill="#2E8B57" transform="rotate(18 68 168)"/>

    <!-- bamboo -->
    <line x1="50" y1="224" x2="62" y2="122" stroke="#8BC34A" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#5E9E2F" stroke-width="2.5" stroke-linecap="round">
      <line x1="47" y1="198" x2="58" y2="198"/>
      <line x1="50" y1="172" x2="61" y2="172"/>
      <line x1="53" y1="147" x2="64" y2="147"/>
    </g>
    <g class="leaf" fill="#7CB342">
      <ellipse cx="77" cy="113" rx="15" ry="5" transform="rotate(-30 77 113)"/>
      <ellipse cx="47" cy="112" rx="14" ry="5" transform="rotate(25 47 112)"/>
      <ellipse cx="63" cy="104" rx="13" ry="4.5" transform="rotate(-85 63 104)"/>
    </g>
    <!-- paw gripping bamboo -->
    <circle cx="60" cy="172" r="11" fill="#2E8B57"/>

    <!-- waving right arm -->
    <g class="wave">
      <ellipse cx="170" cy="142" rx="14" ry="26" fill="#2E8B57" transform="rotate(-25 170 142)"/>
    </g>

    <!-- ears -->
    <circle class="earL" cx="80" cy="62" r="19" fill="#2E8B57"/>
    <circle class="earR" cx="160" cy="62" r="19" fill="#2E8B57"/>
    <circle cx="80" cy="62" r="8" fill="#7FD1A8" opacity=".6"/>
    <circle cx="160" cy="62" r="8" fill="#7FD1A8" opacity=".6"/>

    <!-- head -->
    <circle cx="120" cy="102" r="54" fill="#fff" stroke="#2E8B57" stroke-width="3"/>

    <!-- eye patches -->
    <ellipse cx="97" cy="98" rx="14" ry="18" fill="#2E8B57" transform="rotate(20 97 98)"/>
    <ellipse cx="143" cy="98" rx="14" ry="18" fill="#2E8B57" transform="rotate(-20 143 98)"/>

    <!-- eyes -->
    <g class="blink">
      <circle cx="98" cy="98" r="7" fill="#fff"/>
      <circle cx="142" cy="98" r="7" fill="#fff"/>
      <circle cx="99" cy="99" r="4" fill="#12202A"/>
      <circle cx="141" cy="99" r="4" fill="#12202A"/>
      <circle cx="100.5" cy="97" r="1.5" fill="#fff"/>
      <circle cx="142.5" cy="97" r="1.5" fill="#fff"/>
    </g>

    <!-- blush -->
    <ellipse cx="82" cy="122" rx="8" ry="5" fill="#FF9EB5" opacity=".55"/>
    <ellipse cx="158" cy="122" rx="8" ry="5" fill="#FF9EB5" opacity=".55"/>

    <!-- nose -->
    <ellipse cx="120" cy="116" rx="8" ry="5.5" fill="#12202A"/>

    <!-- smile -->
    <path d="M104 126 Q120 144 136 126" fill="none" stroke="#FF4F8B" stroke-width="4" stroke-linecap="round"/>
    <path d="M114 133 Q120 140 126 133" fill="#FFB3C9" opacity=".9"/>

    <!-- small hat -->
    <g transform="rotate(-6 120 50)">
      <path d="M100 50 L140 50 L122 8 Z" fill="#4169E1"/>
      <polygon points="107.3,36 134,36 130.6,28 111.5,28" fill="#fff" opacity=".85"/>
      <ellipse cx="120" cy="50" rx="21" ry="4.5" fill="#2F4FB8"/>
      <circle cx="122" cy="8" r="5.5" fill="#FFD54F"/>
    </g>
  </g>
</svg>
