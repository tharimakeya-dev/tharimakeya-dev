<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150">
  <rect width="640" height="150" rx="10" fill="#14141f"/>
  <text font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#a8f5ee">
    <tspan x="25" y="45">“What's very important from my point of view is that there is one</tspan>
    <tspan x="25" y="70">web. Anyone that tries to chop it into two will find that their piece</tspan>
    <tspan x="25" y="95">looks very boring.”</tspan>
  </text>
  <text x="615" y="130" text-anchor="end" font-family="Arial, sans-serif"
        font-size="14" font-style="italic" fill="#ff3d81">- Tim Berners-Lee</text>
</svg>
