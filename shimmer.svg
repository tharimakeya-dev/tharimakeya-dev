<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F72585"/>
      <stop offset="25%" stop-color="#B5179E"/>
      <stop offset="50%" stop-color="#4361EE"/>
      <stop offset="75%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#F72585"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="400" y="65" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#g)">
    Code. Build. Solve. Repeat.
  </text>
</svg>
