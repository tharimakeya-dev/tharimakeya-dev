
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="33%" stop-color="#9333EA"/>
      <stop offset="66%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#3B82F6"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- বাঁ দিকের ইমোজি -->
  <text x="90" y="68" text-anchor="middle" font-size="28">💙</text>
  <text x="135" y="68" text-anchor="middle" font-size="28">❤️</text>

  <!-- মাঝের লেখা -->
  <text x="500" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" font-style="italic" fill="url(#g)">Thanks for visiting my profile!</text>

  <!-- ডান দিকের ইমোজি -->
  <text x="865" y="68" text-anchor="middle" font-size="28">❤️</text>
  <text x="910" y="68" text-anchor="middle" font-size="28">💜</text>
</svg>
