<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" role="img" aria-label="Animated wave with fish" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <g id="fish">
      <polygon points="-16,0 -32,-10 -32,10"/>
      <ellipse cx="0" cy="0" rx="19" ry="11"/>
      <path d="M-4,-10 Q2,-20 8,-9 Z"/>
      <circle cx="10" cy="-2.5" r="3" fill="#fff"/>
      <circle cx="11" cy="-2.5" r="1.4" fill="#222"/>
    </g>
  </defs>

  <!-- back wave -->
  <g>
    <path fill="url(#g2)" opacity="0.55" d="M0,110 C225,50 675,170 900,110 C1125,50 1575,170 1800,110 L1800,240 L0,240 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- fish (up / down animation) -->
  <g>
    <g transform="translate(70,150)"><g fill="#ff6b6b"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-18;0,0;0,18;0,0" dur="3s" repeatCount="indefinite"/></g></g>
    <g transform="translate(180,120) scale(-1,1)"><g fill="#feca57"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,16;0,0;0,-16;0,0" dur="3.6s" repeatCount="indefinite"/></g></g>
    <g transform="translate(290,165)"><g fill="#ff9ff3"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,0;0,20;0,0" dur="4s" repeatCount="indefinite"/></g></g>
    <g transform="translate(400,130) scale(-1,1)"><g fill="#1dd1a1"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,18;0,0;0,-18;0,0" dur="3.2s" repeatCount="indefinite"/></g></g>
    <g transform="translate(510,155)"><g fill="#ff9f43"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0;0,16;0,0" dur="3.8s" repeatCount="indefinite"/></g></g>
    <g transform="translate(620,125) scale(-1,1)"><g fill="#54a0ff"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,20;0,0;0,-20;0,0" dur="4.2s" repeatCount="indefinite"/></g></g>
    <g transform="translate(730,160)"><g fill="#a55eea"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-18;0,0;0,18;0,0" dur="3.4s" repeatCount="indefinite"/></g></g>
    <g transform="translate(830,130) scale(-1,1)"><g fill="#00d2d3"><use href="#fish"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,16;0,0;0,-16;0,0" dur="3.9s" repeatCount="indefinite"/></g></g>
  </g>

  <!-- front waves -->
  <g>
