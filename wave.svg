    <pattern id="dots1" patternUnits="userSpaceOnUse" x="0" y="0" width="100" height="14">
      <circle cx="7" cy="7" r="5" fill="#F72585"/>
      <circle cx="21" cy="7" r="5" fill="#9333EA"/>
      <circle cx="35" cy="7" r="5" fill="#3B82F6"/>
      <circle cx="49" cy="7" r="5" fill="#4CC9F0"/>
     
