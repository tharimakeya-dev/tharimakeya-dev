<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
      <stop offset="0%" stop-color="#F72585"/>
      <stop offset="20%" stop-color="#9333EA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="70%" stop-color="#9333EA"/>
      <stop offset="90%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="25%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#4CC9F0"/>
      <stop offset="75%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <g opacity="0.45">
    <path fill="url(#g3)" d="M0,110 C200,60 300,60 500,110 S800,160 1000,110 S1300,60 1500,110 S1800,160 2000,110 V200 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.65">
    <path fill="url(#g2)" d="M0,125 C200,75 300,75 500,125 S800,175 1000,125 S1300,75 1500,125 S1800,175 2000,125 V200 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-size="36" text-anchor="middle">
    <text x="150" y="105">🌹
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" dur="1.4s" repeatCount="indefinite"/>
    </text>
    <text x="325" y="105">⭐
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -35;0 0" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="105">🐼
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -40;0 0" dur="1.6s" begin="0.1s" repeatCount="indefinite"/>
    </text>
    <text x="675" y="105">⭐
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -35;0 0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="105">🌹
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <path fill="url(#g1)" opacity="0.85" d="M0,145 C200,100 300,100 500,145 S800,190 1000,145 S1300,100 1500,145 S1800,190 2000,145 V200 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
